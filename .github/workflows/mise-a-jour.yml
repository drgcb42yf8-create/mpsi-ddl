# Lance les tests des parseurs à chaque modification du code.
name: Tests

on:
  push:
    paths: ["suivi/**", "tests/**", "requirements.txt", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
