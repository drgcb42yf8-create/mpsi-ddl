# Mise à jour automatique des données, puis publication du site.
#  - toutes les 30 minutes (le programme Python décide ce qui est vraiment dû) ;
#  - à la main : onglet « Actions » > « Mise à jour » > « Run workflow » ;
#  - à chaque modification du site (dossier docs/) : republication.
name: Mise à jour

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/mise-a-jour.yml"]

permissions:
  contents: write   # enregistrer les nouvelles données dans le dépôt
  pages: write      # publier le site
  id-token: write   # (exigé par la publication GitHub Pages)

# Jamais deux mises à jour en même temps.
concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques Python
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      # Heures des dernières vérifications : gardées hors du dépôt (cache GitHub).
      - name: Récupérer l'état précédent
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: .etat
          key: etat-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: etat-

      - name: Mettre à jour les données
        if: github.event_name != 'push'
        env:
          PLUS_IDENTIFIANT: ${{ secrets.PLUS_IDENTIFIANT }}
          PLUS_MOT_DE_PASSE: ${{ secrets.PLUS_MOT_DE_PASSE }}
          PHRASE_SECRETE: ${{ secrets.PHRASE_SECRETE }}
          NTFY_SUJET: ${{ secrets.NTFY_SUJET }}
          MANUEL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p .etat
          python -m suivi.principal

      - name: Sauvegarder l'état
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: .etat
          key: etat-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enregistrer les données si elles ont changé
        id: enregistrement
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/donnees
          if git diff --cached --quiet; then
            echo "change=non" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Mise à jour des données"
            git pull --rebase
            git push
            echo "change=oui" >> "$GITHUB_OUTPUT"
          fi

      # Publication du site (seulement si quelque chose a changé).
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' || steps.enregistrement.outputs.change == 'oui'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || steps.enregistrement.outputs.change == 'oui'
        with:
          path: docs
      - id: publication
        uses: actions/deploy-pages@v4
        if: github.event_name == 'push' || steps.enregistrement.outputs.change == 'oui'
